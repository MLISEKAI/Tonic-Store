services:
  server-fe:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app-network

  server-be:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
    expose:
      - "8085"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  server-fe-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    env_file:
      - ./admin/.env.production
    environment:
      - NODE_ENV=production
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: tonic-store
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - ./backend/.env.production
    environment:
      TZ: Asia/Vietnam
      MYSQL_INITDB_SKIP_TZINFO: 1
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: tonic-redis
    restart: unless-stopped
    # Chi dung trong mang noi bo Docker, khong publish port ra host
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/html:/var/www/certbot
      - ./docker/nginx/logs:/var/log/nginx
      - ./docker/nginx/vhost:/etc/nginx/vhost
    depends_on:
      - server-fe
      - server-fe-admin
      - server-be
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/html:/var/www/certbot
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
