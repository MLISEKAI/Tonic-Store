name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tonic-store

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock
            admin/yarn.lock

      - name: Install Backend
        run: cd backend && yarn install --frozen-lockfile && npx prisma generate

      - name: Install Frontend
        run: cd frontend && yarn install --frozen-lockfile

      - name: Install Admin
        run: cd admin && yarn install --frozen-lockfile

      - name: Lint & Build Backend
        run: |
          cd backend
          yarn lint
          yarn build

      - name: Lint & Build Frontend
        run: |
          cd frontend
          yarn lint
          yarn build

      - name: Lint & Build Admin
        run: |
          cd admin
          yarn lint
          yarn build

  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set SHORT_SHA
        id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.short_sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.short_sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Admin
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/admin:${{ steps.short_sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Backend (Render)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo ">> Chua cau hinh secret RENDER_DEPLOY_HOOK - bo qua deploy backend"
            exit 0
          fi
          echo ">> Trigger Render deploy..."
          curl -sf -X POST "$RENDER_DEPLOY_HOOK"

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_DEPLOY_HOOK_FRONTEND: ${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_FRONTEND" ]; then
            echo ">> Chua cau hinh secret VERCEL_DEPLOY_HOOK_FRONTEND - bo qua deploy frontend"
            exit 0
          fi
          echo ">> Trigger Vercel deploy (frontend)..."
          curl -sf -X POST "$VERCEL_DEPLOY_HOOK_FRONTEND"

      - name: Deploy Admin (Vercel)
        env:
          VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_ADMIN" ]; then
            echo ">> Chua cau hinh secret VERCEL_DEPLOY_HOOK_ADMIN - bo qua deploy admin"
            exit 0
          fi
          echo ">> Trigger Vercel deploy (admin)..."
          curl -sf -X POST "$VERCEL_DEPLOY_HOOK_ADMIN"
