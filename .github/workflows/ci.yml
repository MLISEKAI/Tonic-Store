name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        cache-dependency-path: |
          backend/yarn.lock
          frontend/yarn.lock
          admin/yarn.lock

    - name: Install Dependencies
      run: |
        cd backend && yarn install --frozen-lockfile && npx prisma generate
        cd ../frontend && yarn install --frozen-lockfile
        cd ../admin && yarn install --frozen-lockfile

    - name: Run Backend Lint
      run: |
        cd backend && yarn lint

    - name: Run Backend Build
      run: |
        cd backend && yarn build

    - name: Run Frontend Lint
      run: |
        cd frontend && yarn lint

    - name: Run Admin Lint
      run: |
        cd admin && yarn lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy Backend (Render)
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo ">> Chua cau hinh secret RENDER_DEPLOY_HOOK - bo qua deploy backend"
          exit 0
        fi
        echo ">> Trigger Render deploy..."
        curl -sf -X POST "$RENDER_DEPLOY_HOOK"
        echo ">> Render dang deploy, xem tien trinh tai Dashboard > Events"

    - name: Deploy Frontend (Vercel)
      env:
        VERCEL_DEPLOY_HOOK_FRONTEND: ${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}
      run: |
        if [ -z "$VERCEL_DEPLOY_HOOK_FRONTEND" ]; then
          echo ">> Chua cau hinh secret VERCEL_DEPLOY_HOOK_FRONTEND - bo qua deploy frontend"
          exit 0
        fi
        echo ">> Trigger Vercel deploy (frontend)..."
        curl -sf -X POST "$VERCEL_DEPLOY_HOOK_FRONTEND"

    - name: Deploy Admin (Vercel)
      env:
        VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
      run: |
        if [ -z "$VERCEL_DEPLOY_HOOK_ADMIN" ]; then
          echo ">> Chua cau hinh secret VERCEL_DEPLOY_HOOK_ADMIN - bo qua deploy admin"
          exit 0
        fi
        echo ">> Trigger Vercel deploy (admin)..."
        curl -sf -X POST "$VERCEL_DEPLOY_HOOK_ADMIN"
