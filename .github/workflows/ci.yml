name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock
            admin/yarn.lock

      - name: Install Backend
        run: cd backend && yarn install --frozen-lockfile && npx prisma generate

      - name: Install Frontend
        run: cd frontend && yarn install --frozen-lockfile

      - name: Install Admin
        run: cd admin && yarn install --frozen-lockfile

      - name: Lint & Build Backend
        run: |
          cd backend
          yarn lint
          yarn build

      - name: Lint & Build Frontend
        run: |
          cd frontend
          yarn lint
          yarn build

      - name: Lint & Build Admin
        run: |
          cd admin
          yarn lint
          yarn build
