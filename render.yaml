services:
  - type: web
    name: tonic-store-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8085
      - key: HOST
        value: 0.0.0.0
      - key: LOG_DIR
        value: /tmp/logs
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromSecret: JWT_REFRESH_SECRET
      - key: FRONTEND_URL
        fromSecret: FRONTEND_URL
      - key: VITE_ADMIN_URL
        fromSecret: VITE_ADMIN_URL
      - key: EMAIL_USER
        fromSecret: EMAIL_USER
      - key: EMAIL_PASS
        fromSecret: EMAIL_PASS
      - key: VNPAY_TMN_CODE
        fromSecret: VNPAY_TMN_CODE
      - key: VNPAY_SECRET_KEY
        fromSecret: VNPAY_SECRET_KEY
      - key: VNPAY_HASH_SECRET
        fromSecret: VNPAY_HASH_SECRET
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        fromSecret: VNPAY_RETURN_URL

  - type: redis
    name: tonic-store-redis
    plan: free
    region: oregon
